<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" />
    <script>
      // Resolve the saved theme before the app paints.
      let preference = "system";
      try {
        const saved = localStorage.getItem("causal-sandbox-theme");
        if (["light", "dark"].includes(saved)) preference = saved;
      } catch (error) {
        if (error.name !== "SecurityError") throw error;
      }
      document.documentElement.dataset.themePreference = preference;
      document.documentElement.dataset.theme =
        preference === "system"
          ? matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light"
          : preference;
    </script>
    <meta
      name="description"
      content="Learn causal inference by changing the world. Change a setting and compare your estimate with the known causal effect."
    />
    <link rel="icon" type="image/svg+xml" href="/src/brand.svg" />
    <title>Causal Sandbox</title>
    <script
      data-goatcounter="https://ckirkle.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
