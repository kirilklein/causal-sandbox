  <title id="title">Causal Sandbox · Site views</title>
  <desc id="description">870 cumulative site views at the 24 Sept 2026 UTC cutoff (including the midnight hour). Daily snapshots from 6 Sept 2026, connected with a monotone curve. GoatCounter counts site visits, not lifetime unique people.</desc>
