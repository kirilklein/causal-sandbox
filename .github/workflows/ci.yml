name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  push:
    branches-ignore: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check src tests index.html methodology/index.html confounding/index.html collider-bias/index.html positivity/index.html inverse-probability-weighting/index.html aipw-double-robustness/index.html mediator-adjustment/index.html tmle/index.html propensity-score-clipping-trimming/index.html package.json README.md
      - run: npm test
      - run: npm run build
        env:
          VITE_FEEDBACK_ENDPOINT: https://formspree.io/f/feedbacktest
      - run: npx playwright install --with-deps chromium
      - name: Browser test against built site
        run: |
          npx vite preview --port 5173 --host 127.0.0.1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          npm run test:browser
      - run: node tests/trimming-study.mjs
      - name: Build isolated analytics test site
        run: npm run build -- --outDir dist-analytics
        env:
          VITE_POSTHOG_KEY: phc_ci_test_key
          VITE_POSTHOG_HOST: https://analytics.invalid
      - name: Analytics payload regression
        run: |
          npx vite preview --outDir dist-analytics --port 5174 --strictPort --host 127.0.0.1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5174/causal-sandbox/ >/dev/null && break; sleep 1; done
          APP_URL=http://127.0.0.1:5174/causal-sandbox/ node tests/analytics-browser.mjs
