name: Update README site views

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-site-views
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'kirilklein/causal-sandbox' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/site-views.test.mjs
      - name: Check out published chart data
        uses: actions/checkout@v4
        with:
          ref: site-views
          path: traffic-data
      - run: node scripts/update-site-views.mjs traffic-data/docs
      - name: Commit updated chart and aggregate history
        working-directory: traffic-data
        run: |
          git add docs/site-views.json docs/site-views.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh site views'
          git push
